packages:
  - packages/*
  - examples/node
  - examples/todo
  - examples/deno
  - examples/workers

# Link workspace packages locally. `pnpm pack` rewrites workspace ranges
# to real semver ranges in the published manifest.
linkWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true
